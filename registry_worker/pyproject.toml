[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ejn-registry-worker"
version = "0.1.0"
description = "Bounded transactional registry worker for emacs-jupyter-notebook"
requires-python = ">=3.10"

[project.scripts]
ejn-registry-worker = "ejn_registry_worker.__main__:main"

[tool.setuptools]
packages = ["ejn_registry_worker"]
