[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ejn-helper"
version = "0.1.0"
description = "Bounded local transport helper for emacs-jupyter-notebook"
requires-python = ">=3.10"
dependencies = ["jupyter-client>=8,<9", "pyzmq>=25,<28", "Pillow>=10,<13", "ejn-array-protocol==0.1.0"]

[project.scripts]
ejn-helper = "ejn_helper.__main__:main"

[tool.setuptools]
packages = ["ejn_helper"]
